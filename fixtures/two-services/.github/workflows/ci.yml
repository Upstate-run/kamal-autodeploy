name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fixture checks
        run: |
          test -x bin/kamal-rails && test -x bin/kamal-edge
          grep -q 'http_port: 80' config/deploy.rails.yml
          grep -q 'http_port: 80' config/deploy.edge.yml
          # FIXTURE_FAIL is a switch for the acceptance run's "CI failure blocks" step.
          if test -f FIXTURE_FAIL; then echo "FIXTURE_FAIL is present"; exit 1; fi
