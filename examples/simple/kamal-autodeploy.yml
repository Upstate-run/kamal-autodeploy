# Generated by kamal-autodeploy from .kamal-autodeploy.yml.
# Edit .kamal-autodeploy.yml and run `kamal-autodeploy init` to regenerate. If you edit this
# file by hand, the generator stops overwriting it (the checksum below no longer matches).
# kamal-autodeploy-checksum: sha256:0128123a5ca5d96688a716ff88d8208250a625521e630b14d54de52ac691db0c
name: kamal-autodeploy

on:
  # Deploys follow CI on the trusted branch; a green pull request check is never enough.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy: deploy the unit now; rollback: roll the unit back to version; doctor: SSH check only"
        type: choice
        options: [deploy, rollback, doctor]
        default: deploy
      unit:
        description: Deployment unit
        type: choice
        options: [shop]
      version:
        description: Version to roll back to (rollback only; usually a full commit SHA)
        type: string
        required: false

permissions: {}

# One deploy run at a time per repository. A newer run waits; a still-queued older run may
# be replaced, which is safe because selection always deploys the newest green commit
# measured from each unit's last successful deploy.
concurrency:
  group: "kamal-autodeploy-${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action != 'doctor' && 'trusted' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && ((github.event.workflow_run.name == 'CI' && (github.event.workflow_run.path == '.github/workflows/ci.yml' || startsWith(github.event.workflow_run.path, '.github/workflows/ci.yml@')))) && 'trusted' || github.run_id) }}"
  cancel-in-progress: false

jobs:
  select:
    name: Select units
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      attention: ${{ steps.select.outputs.attention }}
      shop_action: ${{ steps.select.outputs.shop_action }}
      shop_sha: ${{ steps.select.outputs.shop_sha }}
      shop_baseline: ${{ steps.select.outputs.shop_baseline }}
      shop_version: ${{ steps.select.outputs.shop_version }}
      shop_automatic_head: ${{ steps.select.outputs.shop_automatic_head }}
    steps:
      - name: Verify the trigger before anything else
        id: verify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RUN_REPO: ${{ github.event.workflow_run.repository.full_name }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            workflow_run)
              [ "$RUN_REPO" = "$REPO" ] || fail "CI run belongs to another repository"
              [ "$RUN_HEAD_REPO" = "$REPO" ] || fail "CI run was for a fork"
              [ "$RUN_EVENT" = "push" ] || fail "CI run was not a push"
              [ "$RUN_BRANCH" = "main" ] || fail "CI run was not on main"
              case "$RUN_NAME|${RUN_PATH%%@*}" in
                "CI|.github/workflows/ci.yml") ;;
                *) fail "unexpected CI workflow" ;;
              esac
              sha="$RUN_SHA" ;;
            workflow_dispatch)
              [ "$REF" = "refs/heads/main" ] || fail "dispatch must run on main"
              sha="$DISPATCH_SHA" ;;
            *) fail "unsupported event" ;;
          esac
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "invalid commit SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the deploy branch (history only; nothing from it runs here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go (to build the pinned kamal-autodeploy)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install kamal-autodeploy v0.1.0 (checksum-verified by the Go module proxy and sum database)
        env:
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: |
          go install github.com/Upstate-run/kamal-autodeploy/cmd/kamal-autodeploy@v0.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Select units
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ steps.verify.outputs.sha }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_UNIT: ${{ inputs.unit }}
          INPUT_VERSION: ${{ inputs.version }}
        run: kamal-autodeploy select --event "$EVENT_NAME" --sha "$TRIGGER_SHA" --action "$INPUT_ACTION" --unit "$INPUT_UNIT" --version "$INPUT_VERSION"

  deploy-shop:
    name: Deploy shop
    needs: [select]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.shop_action != '' && needs.select.outputs.shop_action != 'skip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      deployments: write
      packages: write
    env:
      ACTION: ${{ needs.select.outputs.shop_action }}
      DEPLOY_SHA: ${{ needs.select.outputs.shop_sha }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.shop_sha }}
          persist-credentials: false
      - name: Verify the checkout
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid commit SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || { echo "::error::checkout is not $DEPLOY_SHA"; exit 1; }
      - name: Set up Go (to build the pinned kamal-autodeploy)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install kamal-autodeploy v0.1.0 (checksum-verified by the Go module proxy and sum database)
        env:
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: |
          go install github.com/Upstate-run/kamal-autodeploy/cmd/kamal-autodeploy@v0.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Last check before deploying (staleness) and open a GitHub Deployment
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATIC_HEAD: ${{ needs.select.outputs.shop_automatic_head }}
          BASELINE: ${{ needs.select.outputs.shop_baseline }}
          ROLLBACK_VERSION: ${{ needs.select.outputs.shop_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: kamal-autodeploy guard --unit shop --environment production --branch 'main' --action "$ACTION" --sha "$DEPLOY_SHA" --baseline "$BASELINE" --automatic-head "$AUTOMATIC_HEAD" --version "$ROLLBACK_VERSION" --run-url "$RUN_URL"
      - name: Set up Ruby and Kamal
        if: ${{ steps.guard.outputs.proceed == 'true' && (env.ACTION == 'deploy' || env.ACTION == 'rollback') }}
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
      - name: SSH with the dedicated CI key and pinned host keys
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        env:
          SSH_KEY: ${{ secrets.KAMAL_AUTODEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.KAMAL_AUTODEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] || { echo "::error::secret KAMAL_AUTODEPLOY_SSH_KEY is missing in environment production; run kamal-autodeploy provision"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::variable KAMAL_AUTODEPLOY_KNOWN_HOSTS is missing in environment production; run kamal-autodeploy provision"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  BatchMode yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keygen -F '198.51.100.20' -f ~/.ssh/known_hosts > /dev/null || { echo "::error::host key for 198.51.100.20 is not pinned; run kamal-autodeploy provision"; exit 1; }
          eval "$(ssh-agent -s)" > /dev/null
          printf '%s\n' "$SSH_KEY" | ssh-add - 2> /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Verify selected checkout host pins
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        env:
          KNOWN_HOSTS: ${{ vars.KAMAL_AUTODEPLOY_KNOWN_HOSTS }}
        run: kamal-autodeploy verify-hosts --config 'config/deploy.yml' --destination '' --command 'bin/kamal' --
      - name: Run Kamal (bin/kamal)
        id: kamal
        if: ${{ steps.guard.outputs.proceed == 'true' && (env.ACTION == 'deploy' || env.ACTION == 'rollback') }}
        env:
          ROLLBACK_VERSION: ${{ needs.select.outputs.shop_version }}
          KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            deploy) 'bin/kamal' deploy --version="$DEPLOY_SHA" ;;
            rollback)
              [[ "$ROLLBACK_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "::error::invalid rollback version"; exit 1; }
              'bin/kamal' rollback "$ROLLBACK_VERSION" ;;
            *) echo "::error::unknown action $ACTION"; exit 1 ;;
          esac
      - name: SSH connectivity check (doctor)
        if: ${{ steps.guard.outputs.proceed == 'true' && env.ACTION == 'doctor' }}
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -p 22 'root@198.51.100.20' true && echo 'reachable: root@198.51.100.20'
      - name: Record the outcome on the GitHub Deployment
        if: ${{ always() && steps.guard.outputs.deployment_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.guard.outputs.deployment_id }}
          OUTCOME: ${{ steps.kamal.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: kamal-autodeploy record --deployment-id "$DEPLOYMENT_ID" --outcome "$OUTCOME" --run-url "$RUN_URL"
      - name: Clean up
        if: ${{ always() }}
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k > /dev/null || true; fi
          rm -f ~/.ssh/known_hosts ~/.ssh/config

  report:
    name: Needs attention
    needs: [select, deploy-shop]
    if: ${{ always() && needs.select.outputs.attention != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail the run so a person looks
        env:
          ATTENTION: ${{ needs.select.outputs.attention }}
        run: |
          echo "::error::$ATTENTION"
          exit 1
