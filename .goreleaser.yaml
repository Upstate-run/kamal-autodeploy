# Invoked only by the private designated publication script from sanitized source.
version: 2
project_name: kamal-autodeploy
builds:
  - id: kamal-autodeploy
    main: ./cmd/kamal-autodeploy
    binary: kamal-autodeploy
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/Upstate-run/kamal-autodeploy/internal/cli.Version={{ .Tag }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Keep source-file archive metadata stable when resuming from a fresh export.
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
checksum:
  name_template: checksums.txt
  algorithm: sha256
release:
  draft: true
changelog:
  disable: true
